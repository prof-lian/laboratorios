<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva Laboratório de Informática 02</title>
    <style>
        /* ================= ESTILOS GLOBAIS ================= */
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; color: #333; margin: 0; padding: 10px; display: flex; flex-direction: column; min-height: 100vh; }
        .container { flex: 1; max-width: 1000px; margin: 0 auto; background-color: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 100%; box-sizing: border-box; }
        
        .header { border-bottom: 2px solid #005f6b; padding-bottom: 15px; margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center; position: relative; }
        .logo-escola { width: 60px; height: auto; margin-right: 15px; }
        .header-textos h1 { color: #004080; font-size: 20px; margin: 0; }
        .header-textos h2 { color: #555; font-size: 11px; margin: 0; text-transform: uppercase; }

        /* ================= NAVEGAÇÃO E TELAS ================= */
        .tela { display: none; }
        .tela.ativa { display: block; }
        .nav-mes { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; background-color: #f0f4f8; padding: 8px; border-radius: 5px; }
        .nav-mes button { padding: 8px 12px; font-size: 12px; font-weight: bold; cursor: pointer; background-color: #005f6b; color: white; border: none; border-radius: 4px; }
        
        /* ================= GRADE SEMANAL (SEM ROLAGEM) ================= */
        .calendario-semana { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; width: 100%; box-sizing: border-box; }
        .dia-semana-header { background-color: #005f6b; color: white; padding: 8px 2px; text-align: center; font-size: 12px; font-weight: bold; border-radius: 4px 4px 0 0; }
        .dia-visual { background-color: #fff; border: 1px solid #ddd; display: flex; flex-direction: column; min-width: 0; }
        .dia-numero-visual { background-color: #f0f4f8; font-size: 13px; font-weight: bold; text-align: center; padding: 5px 0; border-bottom: 1px solid #005f6b; color: #005f6b; }
        .turno-titulo { font-size: 9px; font-weight: bold; text-align: center; background-color: #eee; padding: 3px 0; color: #666; }
        
        .slot { font-size: 10px; padding: 4px 2px; border-bottom: 1px solid #eee; min-height: 50px; overflow: hidden; line-height: 1.1; }
        .slot b { color: #005f6b; font-size: 10px; display: block; margin-bottom: 1px; }
        .slot-disciplina { font-size: 9px; color: #666; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .slot-ocupado { background-color: #d1ecf1; font-weight: bold; }
        .slot-proerd { background-color: #fff3cd; color: #856404; }
        .slot-bloqueado { background-color: #f8d7da; color: #721c24; text-decoration: line-through; }

        /* ================= TABELA DE BAIXO ================= */
        .tabela-wrapper { width: 100%; overflow-x: auto; }
        .tabela-agendamentos { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 10px; }
        .tabela-agendamentos th { background-color: #17a2b8; color: white; padding: 10px; text-align: left; }
        .tabela-agendamentos td { border: 1px solid #ddd; padding: 10px; }

        /* ================= RESPONSIVIDADE (CELULAR) ================= */
        @media (max-width: 600px) {
            .container { padding: 10px; }
            .header-textos h1 { font-size: 16px; }
            .dia-semana-header { font-size: 10px; }
            .dia-numero-visual { font-size: 11px; }
            .slot { font-size: 9px; min-height: 45px; }
            .slot b { font-size: 9px; }
            .turno-titulo { font-size: 8px; }
            .tabela-agendamentos { font-size: 11px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div id="tela-lista-publica" class="tela ativa">
        <h3 style="text-align:center; color:#005f6b; margin-top:0;">📅 Grade Semanal de Reservas</h3>
        
        <div class="nav-mes">
            <button onclick="mudarSemana(-1)">← Ant</button>
            <span id="semana-texto-publica" style="font-weight:bold; font-size:13px;"></span>
            <button onclick="mudarSemana(1)">Próx →</button>
        </div>

        <div class="calendario-semana" id="grade-dias-lista">
            </div>

        <hr style="margin: 30px 0; border: 1px dashed #ccc;">

        <h3 style="text-align:center; color:#005f6b;">📋 Detalhes dos Horários (Mensal)</h3>
        <div class="nav-mes">
            <button onclick="mudarMesTabela(-1)">←</button>
            <span id="titulo-tabela-publica" style="font-weight:bold;"></span>
            <button onclick="mudarMesTabela(1)">→</button>
        </div>
        
        <div class="tabela-wrapper">
            <table class="tabela-agendamentos">
                <thead>
                    <tr>
                        <th>Data</th>
                        <th>Horários</th>
                        <th>Professor / Disciplina</th>
                    </tr>
                </thead>
                <tbody id="corpo-tabela-publica"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // Lógica simplificada para visualização do ajuste solicitado
    const mesesNomes = ["JANEIRO", "FEVEREIRO", "MARÇO", "ABRIL", "MAIO", "JUNHO", "JULHO", "AGOSTO", "SETEMBRO", "OUTUBRO", "NOVEMBRO", "DEZEMBRO"];
    let dataSemanaVisao = new Date(); // Inicia na semana atual
    
    // Formata o horário como 1º, 2º...
    function formatarHorarioCurto(h) {
        if (h.includes("1º Horário")) return "1º";
        if (h.includes("2º Horário")) return "2º";
        if (h.includes("3º Horário")) return "3º";
        if (h.includes("4º Horário")) return "4º";
        if (h.includes("5º Horário")) return "5º";
        if (h.includes("Vesp")) {
            let n = h.split('º')[0];
            return n + "º (V)";
        }
        return h;
    }

    function renderizarGradeSemanal() {
        const grid = document.getElementById("grade-dias-lista");
        grid.innerHTML = `
            <div class="dia-semana-header">Seg</div>
            <div class="dia-semana-header">Ter</div>
            <div class="dia-semana-header">Qua</div>
            <div class="dia-semana-header">Qui</div>
            <div class="dia-semana-header">Sex</div>
        `;

        // Lógica de cálculo da segunda-feira da semana
        let d = new Date(dataSemanaVisao);
        let day = d.getDay(), diff = d.getDate() - day + (day == 0 ? -6 : 1);
        let segunda = new Date(d.setDate(diff));

        document.getElementById("semana-texto-publica").innerText = "Semana de " + segunda.toLocaleDateString('pt-BR');

        for (let i = 0; i < 5; i++) {
            let diaAtual = new Date(segunda);
            diaAtual.setDate(segunda.getDate() + i);
            let dataStr = diaAtual.toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit'});

            let htmlSlotsMat = "";
            for(let h=1; h<=5; h++) htmlSlotsMat += `<div class="slot"><b>${h}º</b> <span class="slot-disciplina">Livre</span></div>`;
            
            let htmlSlotsVesp = "";
            for(let h=1; h<=5; h++) htmlSlotsVesp += `<div class="slot"><b>${h}º (V)</b> <span class="slot-disciplina">Livre</span></div>`;

            grid.innerHTML += `
                <div class="dia-visual">
                    <div class="dia-numero-visual">${dataStr}</div>
                    <div class="turno-titulo">MAT</div>
                    ${htmlSlotsMat}
                    <div class="turno-titulo">VESP</div>
                    ${htmlSlotsVesp}
                </div>
            `;
        }
    }

    function mudarSemana(n) {
        dataSemanaVisao.setDate(dataSemanaVisao.getDate() + (n * 7));
        renderizarGradeSemanal();
    }

    // Inicialização
    window.onload = () => {
        renderizarGradeSemanal();
        document.getElementById("titulo-tabela-publica").innerText = mesesNomes[new Date().getMonth()];
    };
</script>

</body>
</html>
